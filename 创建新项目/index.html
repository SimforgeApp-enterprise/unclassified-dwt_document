<h1 id="_1">创建新项目</h1>
<p>请按照如下步骤进行操作：</p>
<p>请单击新建按钮</p>
<figure>
  <a class="glightbox" data-type="image" data-width="60%" data-height="auto" href="../figs/%E5%88%9B%E5%BB%BA%E6%96%B0%E9%A1%B9%E7%9B%AE/%E6%96%B0%E5%BB%BA.png" data-desc-position="bottom"><img alt="新建" src="../figs/%E5%88%9B%E5%BB%BA%E6%96%B0%E9%A1%B9%E7%9B%AE/%E6%96%B0%E5%BB%BA.png" width="500"></a>
<br>
<figcaption>新建</figcaption>
</figure>
<p>在此处输入项目名称</p>
<figure>
  <a class="glightbox" data-type="image" data-width="60%" data-height="auto" href="../figs/%E5%88%9B%E5%BB%BA%E6%96%B0%E9%A1%B9%E7%9B%AE/%E9%A1%B9%E7%9B%AE%E5%90%8D%E7%A7%B0.png" data-desc-position="bottom"><img alt="项目名称" src="../figs/%E5%88%9B%E5%BB%BA%E6%96%B0%E9%A1%B9%E7%9B%AE/%E9%A1%B9%E7%9B%AE%E5%90%8D%E7%A7%B0.png" width="500"></a>
<br>
<figcaption>项目名称</figcaption>
</figure>
<p>选择数字风洞试验</p>
<figure>
  <a class="glightbox" data-type="image" data-width="60%" data-height="auto" href="../figs/%E5%88%9B%E5%BB%BA%E6%96%B0%E9%A1%B9%E7%9B%AE/%E8%AF%95%E9%AA%8C%E6%A8%A1%E5%BC%8F.png" data-desc-position="bottom"><img alt="试验模式" src="../figs/%E5%88%9B%E5%BB%BA%E6%96%B0%E9%A1%B9%E7%9B%AE/%E8%AF%95%E9%AA%8C%E6%A8%A1%E5%BC%8F.png" width="500"></a>
<br>
<figcaption>试验模式</figcaption>
</figure>
<p>选择二元试验段、风雷求解器，单击确定</p>
<figure>
  <a class="glightbox" data-type="image" data-width="60%" data-height="auto" href="../figs/%E5%88%9B%E5%BB%BA%E6%96%B0%E9%A1%B9%E7%9B%AE/%E8%AF%95%E9%AA%8C%E6%AE%B5%E7%B1%BB%E5%9E%8B%E5%92%8C%E6%95%B0%E5%80%BC%E5%BC%95%E6%93%8E%E7%B1%BB%E5%9E%8B.png" data-desc-position="bottom"><img alt="试验段类型和数值引擎类型" src="../figs/%E5%88%9B%E5%BB%BA%E6%96%B0%E9%A1%B9%E7%9B%AE/%E8%AF%95%E9%AA%8C%E6%AE%B5%E7%B1%BB%E5%9E%8B%E5%92%8C%E6%95%B0%E5%80%BC%E5%BC%95%E6%93%8E%E7%B1%BB%E5%9E%8B.png" width="500"></a>
<br>
<figcaption>试验段类型和数值引擎类型</figcaption>
 </figure>
<p>此时进入一个新项目的初始化页面中，模型视窗中会自动加载二元风洞模型</p>
<figure>
  <a class="glightbox" data-type="image" data-width="60%" data-height="auto" href="../figs/%E5%88%9B%E5%BB%BA%E6%96%B0%E9%A1%B9%E7%9B%AE/%E6%96%B0%E9%A1%B9%E7%9B%AE%E9%BB%98%E8%AE%A4%E9%A1%B5%E9%9D%A2.png" data-desc-position="bottom"><img alt="新项目默认页面" src="../figs/%E5%88%9B%E5%BB%BA%E6%96%B0%E9%A1%B9%E7%9B%AE/%E6%96%B0%E9%A1%B9%E7%9B%AE%E9%BB%98%E8%AE%A4%E9%A1%B5%E9%9D%A2.png" width="500"></a>
<br>
<figcaption>新项目默认页面</figcaption>
 </figure>
<p>更多选项中的功能正在加紧开发中... ...</p>
